<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portal del Comercial — AsistenteVirtualOk</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --navy:     #0F1F3D;
    --navy-mid: #1A2F52;
    --gold:     #C89B3C;
    --gold-lt:  #F0D080;
    --cream:    #F7F5F0;
    --white:    #FFFFFF;
    --gray-50:  #F9F9F8;
    --gray-100: #EDEDEA;
    --gray-300: #C8C7C2;
    --gray-500: #8C8B85;
    --gray-700: #4A4A45;
    --green:    #1E7A4A;
    --green-lt: #D4EDDA;
    --red:      #B53030;
    --red-lt:   #F8DCDC;
    --amber:    #9A6000;
    --amber-lt: #FFF0CC;
    --blue:     #1A5296;
    --blue-lt:  #D6E8FF;
    --purple:   #5B3DA8;
    --purple-lt:#EDE8FF;
    --radius:   8px;
    --shadow:   0 2px 12px rgba(15,31,61,.10);
    --shadow-lg:0 8px 32px rgba(15,31,61,.15);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--cream);
    color: var(--navy);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── LOGIN ──────────────────────────────────────────── */
  #login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
  }
  .login-card {
    background: var(--white); border-radius: 16px; padding: 48px 40px;
    width: 100%; max-width: 400px; box-shadow: var(--shadow-lg);
  }
  .login-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
  .login-logo-mark {
    width: 44px; height: 44px; border-radius: 10px; background: var(--navy);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 800; color: var(--gold); letter-spacing: -1px;
  }
  .login-logo-text { font-size: 18px; font-weight: 700; color: var(--navy); line-height: 1.2; }
  .login-logo-text span { display: block; font-size: 11px; font-weight: 400; color: var(--gray-500); }
  .login-error { background: var(--red-lt); color: var(--red); padding: 10px 14px; border-radius: var(--radius); margin-bottom: 16px; font-size: 13px; display: none; }

  label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-700); margin-bottom: 5px; letter-spacing: .3px; }
  input[type=email], input[type=password] {
    width: 100%; padding: 9px 12px; border: 1.5px solid var(--gray-300);
    border-radius: var(--radius); font-size: 14px; color: var(--navy);
    background: var(--white); transition: border-color .15s; font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--navy); }
  .field { margin-bottom: 16px; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 18px; border-radius: var(--radius);
    font-size: 13px; font-weight: 600; cursor: pointer;
    border: none; transition: opacity .15s, transform .1s;
    font-family: inherit; letter-spacing: .2px; white-space: nowrap;
  }
  .btn:hover { opacity: .88; }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--navy); color: var(--white); }
  .btn-outline { background: transparent; color: white; border: 1.5px solid rgba(255,255,255,.35); }
  .btn-full { width: 100%; justify-content: center; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* ── APP SHELL ──────────────────────────────────────── */
  #app { display: none; min-height: 100vh; flex-direction: column; }
  .topbar {
    background: var(--navy); padding: 0 24px; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  .topbar-brand { display: flex; align-items: center; gap: 10px; }
  .topbar-mark {
    width: 32px; height: 32px; border-radius: 7px; background: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: var(--navy);
  }
  .topbar-title { color: var(--white); font-weight: 700; font-size: 15px; }
  .topbar-sub   { color: var(--gold-lt); font-size: 11px; margin-top: 1px; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .topbar-user  { color: var(--gray-300); font-size: 12px; }

  .main { flex: 1; padding: 28px 24px; max-width: 1100px; margin: 0 auto; width: 100%; }

  .card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; margin-bottom: 20px; }
  .card-title { font-size: 15px; font-weight: 700; color: var(--navy); margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--gray-100); display: flex; align-items: center; justify-content: space-between; }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-card { background: var(--white); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); border-left: 3px solid var(--gray-300); }
  .stat-card.gold  { border-left-color: var(--gold); }
  .stat-card.blue  { border-left-color: var(--blue); }
  .stat-card.green { border-left-color: var(--green); }
  .stat-card.amber { border-left-color: var(--amber); }
  .stat-card.red   { border-left-color: var(--red); }
  .stat-label { font-size: 11px; color: var(--gray-500); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
  .stat-value { font-size: 26px; font-weight: 800; color: var(--navy); margin-top: 4px; line-height: 1; }

  .field-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .field-row .field { flex: 1; min-width: 160px; margin-bottom: 0; }
  select { width: 100%; padding: 9px 12px; border: 1.5px solid var(--gray-300); border-radius: var(--radius); font-size: 14px; color: var(--navy); background: var(--white); font-family: inherit; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: var(--gray-50); padding: 9px 12px; text-align: left; font-size: 11px; font-weight: 700; color: var(--gray-500); text-transform: uppercase; letter-spacing: .4px; border-bottom: 1px solid var(--gray-100); white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--gray-100); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--gray-50); cursor: pointer; }

  .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: .2px; white-space: nowrap; }
  .badge-enviada           { background: var(--gray-100); color: var(--gray-700); }
  .badge-en_revision       { background: #EFF9FF; color: #1A5296; border: 1px dashed #1A5296; }
  .badge-abierta           { background: var(--blue-lt); color: var(--blue); }
  .badge-plan_seleccionado { background: var(--green-lt); color: var(--green); }
  .badge-en_gestion        { background: var(--amber-lt); color: var(--amber); }
  .badge-en_negociacion    { background: var(--purple-lt); color: var(--purple); }
  .badge-cerrada           { background: var(--green-lt); color: var(--green); }
  .badge-descartada        { background: var(--red-lt); color: var(--red); }

  .empty { text-align: center; padding: 40px 20px; color: var(--gray-500); }
  .empty-icon { font-size: 32px; margin-bottom: 10px; }

  /* ── DETAIL MODAL ─────────────────────────────────────── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,31,61,.55); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.active { display: flex; }
  .modal-box { background: var(--white); border-radius: 12px; max-width: 560px; width: 100%; max-height: 88vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
  .modal-head { padding: 20px 24px; border-bottom: 1px solid var(--gray-100); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--white); }
  .modal-head h3 { font-size: 16px; color: var(--navy); }
  .modal-close { cursor: pointer; font-size: 20px; color: var(--gray-500); background: none; border: none; line-height: 1; }
  .modal-body { padding: 20px 24px; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
  .detail-item label { font-size: 11px; text-transform: uppercase; letter-spacing: .3px; color: var(--gray-500); margin-bottom: 3px; }
  .detail-item .val { font-size: 14px; color: var(--navy); font-weight: 600; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-mark">AVO</div>
      <div class="login-logo-text">AsistenteVirtualOk<span>Portal del Comercial</span></div>
    </div>
    <div id="login-error" class="login-error"></div>
    <div class="field">
      <label>Correo</label>
      <input type="email" id="login-email" placeholder="tu-correo@asistentevirtualok.com" />
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••••" />
    </div>
    <button class="btn btn-primary btn-full" id="login-btn">Entrar</button>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-brand">
      <div class="topbar-mark">AVO</div>
      <div>
        <div class="topbar-title">Portal del Comercial</div>
        <div class="topbar-sub" id="topbar-comercial">—</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="topbar-user" id="topbar-email"></span>
      <a href="#" class="btn btn-outline" id="logout-btn">Salir</a>
    </div>
  </div>

  <div class="main">
    <div class="stats-grid">
      <div class="stat-card gold"><div class="stat-label">Total cotizaciones</div><div class="stat-value" id="st-total">0</div></div>
      <div class="stat-card blue"><div class="stat-label">En seguimiento</div><div class="stat-value" id="st-seguimiento">0</div></div>
      <div class="stat-card green"><div class="stat-label">Servicio seleccionado</div><div class="stat-value" id="st-seleccionado">0</div></div>
      <div class="stat-card amber"><div class="stat-label">Cerradas</div><div class="stat-value" id="st-cerradas">0</div></div>
      <div class="stat-card red"><div class="stat-label">Descartadas</div><div class="stat-value" id="st-descartadas">0</div></div>
    </div>

    <div class="card">
      <div class="card-title">
        <span>Mis cotizaciones</span>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Estado</label>
          <select id="f-estado">
            <option value="">Todos</option>
            <option value="enviada">Enviada</option>
            <option value="abierta">Abierta</option>
            <option value="plan_seleccionado">Servicio seleccionado</option>
            <option value="en_gestion">Contrato firmado</option>
            <option value="en_negociacion">Pago completado</option>
            <option value="cerrada">Cerrada</option>
            <option value="descartada">Descartada</option>
          </select>
        </div>
        <div class="field">
          <label>Buscar cliente / empresa</label>
          <input type="text" id="f-search" placeholder="Nombre o empresa..." />
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Cliente</th>
              <th>Empresa</th>
              <th>Estado</th>
              <th>Servicio seleccionado</th>
              <th>Enviada</th>
              <th>Abierta</th>
            </tr>
          </thead>
          <tbody id="quotes-tbody">
            <tr><td colspan="6"><div class="empty">Cargando...</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-quote">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="mq-title">Cotización</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="detail-grid" id="mq-detail"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://avtznfyenkvfapwxdrho.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF2dHpuZnllbmt2ZmFwd3hkcmhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNTAwNTIsImV4cCI6MjEwMTkyNjA1Mn0.QAIFNFtxnwRrQLkooj7CqK0x2lbWDUaHLnCsBzDYFQo';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let currentComercial = '';
let allQuotes = [];

function fmt(dateStr) {
  if (!dateStr) return '—';
  return new Date(dateStr).toLocaleDateString('es-VE', { day:'2-digit', month:'short', year:'numeric' });
}
function fmtDt(dateStr) {
  if (!dateStr) return '—';
  return new Date(dateStr).toLocaleString('es-VE', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function badgeHtml(estado) {
  const labels = {
    en_revision:'En revisión (no enviada)', enviada:'Enviada', abierta:'Abierta', plan_seleccionado:'Servicio seleccionado',
    en_gestion:'Contrato firmado', en_negociacion:'Pago completado', cerrada:'Cerrada', descartada:'Descartada'
  };
  return `<span class="badge badge-${estado}">${labels[estado] || estado}</span>`;
}

// ── Auth ──────────────────────────────────────────────
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) await handleSession(session);
  else showLogin();

  sb.auth.onAuthStateChange((_e, s) => {
    if (s) handleSession(s); else showLogin();
  });
}

async function handleSession(session) {
  const meta = session.user.user_metadata || {};
  if (meta.role !== 'comercial' || !meta.comercial_nombre) {
    document.getElementById('login-error').textContent = 'Esta cuenta no tiene acceso al portal del comercial. Contacta al administrador.';
    document.getElementById('login-error').style.display = 'block';
    await sb.auth.signOut();
    showLogin();
    return;
  }
  currentComercial = meta.comercial_nombre;
  showApp(session.user);
}

function showLogin() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

async function showApp(user) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('topbar-email').textContent = user.email;
  document.getElementById('topbar-comercial').textContent = currentComercial;
  await loadQuotes();
}

document.getElementById('login-btn').addEventListener('click', async () => {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  const btn = document.getElementById('login-btn');
  btn.textContent = 'Entrando...'; btn.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  btn.textContent = 'Entrar'; btn.disabled = false;
  if (error) { errEl.textContent = 'Credenciales incorrectas.'; errEl.style.display = 'block'; }
});
document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('login-btn').click(); });
document.getElementById('logout-btn').addEventListener('click', (e) => { e.preventDefault(); sb.auth.signOut(); });

// ── Cotizaciones (RLS ya filtra por comercial; el .eq de abajo es solo para más claridad/velocidad) ──
async function loadQuotes() {
  const { data, error } = await sb.from('quotes_full').select('*')
    .eq('comercial', currentComercial)
    .order('created_at', { ascending: false })
    .limit(300);

  if (error) {
    document.getElementById('quotes-tbody').innerHTML = `<tr><td colspan="6"><div class="empty">Error al cargar: ${error.message}</div></td></tr>`;
    return;
  }
  allQuotes = data || [];
  renderStats();
  renderTable();
}

function renderStats() {
  const counts = {};
  allQuotes.forEach(q => { counts[q.estado] = (counts[q.estado] || 0) + 1; });
  document.getElementById('st-total').textContent = allQuotes.length;
  document.getElementById('st-seguimiento').textContent = (counts.enviada||0) + (counts.abierta||0);
  document.getElementById('st-seleccionado').textContent = counts.plan_seleccionado || 0;
  document.getElementById('st-cerradas').textContent = (counts.en_gestion||0) + (counts.en_negociacion||0) + (counts.cerrada||0);
  document.getElementById('st-descartadas').textContent = counts.descartada || 0;
}

function renderTable() {
  const estadoF = document.getElementById('f-estado').value;
  const searchF = document.getElementById('f-search').value.trim().toLowerCase();

  let rows = allQuotes.filter(q => q.estado !== 'en_revision');
  if (estadoF) rows = rows.filter(q => q.estado === estadoF);
  if (searchF) rows = rows.filter(q =>
    (q.cliente_nombre||'').toLowerCase().includes(searchF) ||
    (q.cliente_empresa||'').toLowerCase().includes(searchF)
  );

  const tbody = document.getElementById('quotes-tbody');
  if (rows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty"><div class="empty-icon">📋</div>No hay cotizaciones con estos filtros</div></td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(r => `
    <tr onclick="openDetail('${r.id}')">
      <td><strong>${r.cliente_nombre || '—'}</strong></td>
      <td>${r.cliente_empresa || '—'}</td>
      <td>${badgeHtml(r.estado)}</td>
      <td>${r.plan_seleccionado_nombre || '<span style="color:var(--gray-300)">—</span>'}</td>
      <td><small>${fmt(r.fecha_envio || r.created_at)}</small></td>
      <td>${r.fecha_primera_apertura ? `<small style="color:var(--green)">${fmt(r.fecha_primera_apertura)}</small>` : '<small style="color:var(--gray-500)">No abierta</small>'}</td>
    </tr>
  `).join('');
}
document.getElementById('f-estado').addEventListener('change', renderTable);
document.getElementById('f-search').addEventListener('input', renderTable);

function openDetail(id) {
  const q = allQuotes.find(x => x.id === id);
  if (!q) return;
  document.getElementById('mq-title').textContent = `${q.cliente_nombre} · ${q.cliente_empresa || ''}`;
  document.getElementById('mq-detail').innerHTML = `
    <div class="detail-item"><label>Estado</label><div class="val">${badgeHtml(q.estado)}</div></div>
    <div class="detail-item"><label>Correo del cliente</label><div class="val">${q.cliente_email || '—'}</div></div>
    <div class="detail-item"><label>Fecha de envío</label><div class="val">${fmt(q.fecha_envio || q.created_at)}</div></div>
    <div class="detail-item"><label>Primera apertura</label><div class="val">${q.fecha_primera_apertura ? fmtDt(q.fecha_primera_apertura) : '—'}</div></div>
    <div class="detail-item"><label>Servicio seleccionado</label><div class="val">${q.plan_seleccionado_nombre ? `<strong style="color:var(--green);">✅ ${q.plan_seleccionado_nombre}</strong>` : '—'}</div></div>
    <div class="detail-item"><label>Fecha de selección</label><div class="val">${q.fecha_seleccion ? fmtDt(q.fecha_seleccion) : '—'}</div></div>
    <div class="detail-item"><label>Moneda</label><div class="val">${q.moneda || 'USD'}</div></div>
    <div class="detail-item"><label>Vencimiento</label><div class="val">${q.vencimiento ? fmt(q.vencimiento) : 'Sin vencimiento'}</div></div>
  `;
  document.getElementById('modal-quote').classList.add('active');
}
function closeModal() { document.getElementById('modal-quote').classList.remove('active'); }
document.getElementById('modal-quote').addEventListener('click', (e) => { if (e.target.id === 'modal-quote') closeModal(); });

init();
</script>
</body>
</html>
